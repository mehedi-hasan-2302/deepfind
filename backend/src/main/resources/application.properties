spring.application.name=DeepFind Backend
server.address=127.0.0.1
server.port=8080
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
deepfind.storage.data-directory=${DEEPFIND_DATA_DIRECTORY:${user.home}/.deepfind}
deepfind.extraction.max-file-size-bytes=20971520
deepfind.extraction.max-extracted-characters=500000
deepfind.extraction.timeout=15s
deepfind.extraction.worker-count=2
deepfind.extraction.queue-capacity=32
