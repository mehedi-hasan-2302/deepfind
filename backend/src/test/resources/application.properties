deepfind.storage.data-directory=${java.io.tmpdir}/deepfind-tests/${random.uuid}
deepfind.extraction.max-file-size-bytes=1048576
deepfind.extraction.max-extracted-characters=100000
deepfind.extraction.timeout=5s
deepfind.extraction.worker-count=1
deepfind.extraction.queue-capacity=4
deepfind.watcher.queue-capacity=16
deepfind.watcher.shutdown-timeout=5s
